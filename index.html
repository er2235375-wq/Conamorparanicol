        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b091a;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }
        /* Fondo de constelaciones / estrellas */
        .constellation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ffedf4, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ffd1dc, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 230px 180px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 300px 250px, #ffccd5, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 120px 200px, #bae6fd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 280px 80px, #e9d5ff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 350px 350px;
            opacity: 0.65;
            z-index: 1;
            animation: twinkle 5s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.4; }
            100% { opacity: 0.85; }
        }
        .card {
            position: relative;
            z-index: 2;
            background: rgba(20, 18, 35, 0.85);
            border: 1px solid rgba(255, 182, 193, 0.3);
            border-radius: 20px;
            padding: 30px 20px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        .date-text {
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #d8b4fe;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .flower-container {
            margin: 20px 0;
            position: relative;
        }
        .flower-icon {
            font-size: 64px;
            animation: float 3s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .quote-text {
            font-size: 1.05rem;
            line-height: 1.5;
            color: #fce7f3;
            margin: 20px 0;
            font-style: italic;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Estilos del reproductor de música */
        .music-player {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 182, 193, 0.2);
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .music-btn {
            background: linear-gradient(135deg, #d8b4fe, #f472b6);
            border: none;
            color: #0b091a;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(244, 114, 182, 0.4);
            transition: transform 0.2s, opacity 0.2s;
        }
        .music-btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        .song-info {
            font-size: 0.8rem;
            color: #cbd5e1;
        }
    </style>
</head>

        // Sincronizar fecha, frase y flor diaria
        function actualizarContenidoDiario() {
            const hoy = new Date();
            const inicioAnio = new Date(hoy.getFullYear(), 0, 0);
            const diferencia = (hoy - inicioAnio) + ((inicioAnio.getTimezoneOffset() - hoy.getTimezoneOffset()) * 60 * 1000);
            const diaDelAnio = Math.floor(diferencia / (1000 * 60 * 60 * 24));
            
            const indiceSeleccionado = diaDelAnio % frases.length;

            const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            let fechaFormateada = hoy.toLocaleDateString('es-ES', opciones);
            fechaFormateada = fechaFormateada.charAt(0).toUpperCase() + fechaFormateada.slice(1);

            document.getElementById('fecha-hoy').innerText = fechaFormateada;
            document.getElementById('frase-hoy').innerText = `"${frases[indiceSeleccionado]}"`;
            document.getElementById('icono-flor').innerText = flores[indiceSeleccionado];
        }

        actualizarContenidoDiario();

        const audio = document.getElementById('audio-player');
        const btnReproducir = document.getElementById('btn-reproducir');
        const infoCancion = document.getElementById('info-cancion');
        const sourceAudio = document.getElementById('source-audio');

        function toggleMusica() {
            if (audio.paused) {
                audio.play().then(() => {
                    btnReproducir.innerText = "⏸ Pausar Música";
                }).catch(error => {
                    console.log("Reproducción bloqueada o archivo no encontrado:", error);
                    alert("Asegúrate de haber subido los archivos 'cancion1.mp3' y 'cancion2.mp3' a tu repositorio.");
                });
            } else {
                audio.pause();
                btnReproducir.innerText = "▶ Reproducir Música";
            }
        }

        function cambiarCancion() {
            if (cancionActual === 1) {
                cancionActual = 2;
                sourceAudio.src = "cancion2.mp3";
                infoCancion.innerText = "Reproduciendo: Canción 2 🎵";
            } else {
                cancionActual = 1;
                sourceAudio.src = "cancion1.mp3";
                infoCancion.innerText = "Reproduciendo: Canción 1 🎵";
            }
            audio.load();
            audio.play().then(() => {
                btnReproducir.innerText = "⏸ Pausar Música";
            });
