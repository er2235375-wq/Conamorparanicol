        }

            0%, 100% { transform: translateY(0); }

        // --- 1. CONFIGURACIÓN DEL FONDO DE CONSTELACIONES ---
        const canvas = document.getElementById('canvas-constelaciones');
        const ctx = canvas.getContext('2d');

        let width, height;
        let estrellas = [];

        function ajustarCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', ajustarCanvas);
        ajustarCanvas();

        for (let i = 0; i < 120; i++) {
            estrellas.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radio: Math.random() * 1.5 + 0.5,
                velocidadX: (Math.random() - 0.5) * 0.2,
                velocidadY: (Math.random() - 0.5) * 0.2,
                alfa: Math.random()
            });
        }

        function animarConstelaciones() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';

            estrellas.forEach(est => {
                ctx.globalAlpha = Math.abs(Math.sin(Date.now() * 0.001 + est.alfa));
                ctx.beginPath();
                ctx.arc(est.x, est.y, est.radio, 0, Math.PI * 2);
                ctx.fill();

                est.x += est.velocidadX;
                est.y += est.velocidadY;

                if (est.x < 0) est.x = width;
                if (est.x > width) est.x = 0;
                if (est.y < 0) est.y = height;
                if (est.y > height) est.y = 0;
            });

            ctx.strokeStyle = 'rgba(162, 155, 254, 0.15)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < estrellas.length; i++) {
                for (let j = i + 1; j < estrellas.length; j++) {
                    let dx = estrellas[i].x - estrellas[j].x;
                    let dy = estrellas[i].y - estrellas[j].y;
                    let distancia = Math.sqrt(dx * dx + dy * dy);

                    if (distancia < 100) {
                        ctx.beginPath();
                        ctx.moveTo(estrellas[i].x, estrellas[i].y);
                        ctx.lineTo(estrellas[j].x, estrellas[j].y);
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animarConstelaciones);
        }

        animarConstelaciones();

        // --- 3. LÓGICA PARA MOSTRAR LA FECHA EXACTA Y EL CONTENIDO ---
        function mostrarContenidoDelDia() {
            const hoy = new Date();
            
            // Mostrar fecha exacta bonita (Ej: sábado, 19 de septiembre de 2026)
            const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const fechaFormateada = hoy.toLocaleDateString('es-ES', opcionesFecha);
            document.getElementById('fecha-hoy').innerText = fechaFormateada.charAt(0).toUpperCase() + fechaFormateada.slice(1);

            // Calcular qué día del año es (0 al 364)
            const inicioAnio = new Date(hoy.getFullYear(), 0, 0);
            const diff = hoy - inicioAnio;
            const unDia = 1000 * 60 * 60 * 24;
            const diaDelAnio = Math.floor(diff / unDia) - 1;

            // Seleccionar de la lista de flores de forma cíclica
            const indice = diaDelAnio % contenidoAnual.length;
            const itemActual = contenidoAnual[indice];

            // Inyectar en el HTML
            document.getElementById('flor-nombre').innerText = itemActual.flor;
            document.getElementById('flor-emoji').innerText = itemActual.emoji;
            document.getElementById('frase-texto').innerText = `"${itemActual.frase}"`;
            document.getElementById('frase-firma').innerText = "con amor s.w";
        }
